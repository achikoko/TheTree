# .thetree.yaml — place this file in a module content root.
#
# Structure mirrors the folder tree you see in the project view.
#   * A key beginning with ':' sets a PROPERTY of the current node.
#   * Any other key names a CHILD folder or file.
#   * A key containing '/' is syntactic sugar for nested nodes; the properties
#     apply to the deepest segment. So "src/main/protobuf:" below is the same as
#     writing src: { main: { protobuf: { ... } } }.
#   * If the same node is described twice, later properties win (children merge).
#
# Recognised properties:
#   :compacted  true|false   Surface this folder at the top level as a single
#                            compacted node (like a source root).
#   :weight     <integer>    Ordering key, default 0. LOWER renders ABOVE higher.
#                            Ordering crosses the folder/file divide, so a file
#                            with :weight -1 can sit above a folder with weight 0.
#   :hidden     true|false   Do not display this node at all.

# Treat a non-source folder as a compacted top-level node, and pull it to the top.
#src/main/protobuf:
#  :compacted: true
#  :weight: -10
#
## Another declared compacted folder, pushed below the default-weight nodes.
#generated:
#  :compacted: true
#  :weight: 20
#
## Hide a folder entirely.
#build:
#  :hidden: true
#
## Order individual files. README floats to the very top; CHANGELOG sits just under.
README.md:
  :weight: -100
CHANGELOG.md:
  :weight: -99

## Nesting without the slash sugar: weight applies deep in the tree, and only takes
## effect when this branch is present in the project view.
#docs:
#  :weight: 5
#  internal:
#    :hidden: true
